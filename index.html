<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameCube Banner Editor & Converter</title>

    <!-- Markdown renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- HTML sanitizer -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <script>
function sha256Hex(input) {
  var K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes = new TextEncoder().encode(input);
  var bitLength = bytes.length * 8;
  var paddedLength = Math.ceil((bytes.length + 9) / 64) * 64;
  var data = new Uint8Array(paddedLength);
  data.set(bytes);
  data[bytes.length] = 0x80;
  var view = new DataView(data.buffer);
  view.setUint32(paddedLength - 8, Math.floor(bitLength / 0x100000000));
  view.setUint32(paddedLength - 4, bitLength >>> 0);
  function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
  for (var offset = 0; offset < paddedLength; offset += 64) {
    var w = new Uint32Array(64);
    for (var i = 0; i < 16; i++) w[i] = view.getUint32(offset + i * 4);
    for (var j = 16; j < 64; j++) {
      var x = w[j - 15], y = w[j - 2];
      var s0 = rotr(x, 7) ^ rotr(x, 18) ^ (x >>> 3);
      var s1 = rotr(y, 17) ^ rotr(y, 19) ^ (y >>> 10);
      w[j] = (w[j - 16] + s0 + w[j - 7] + s1) >>> 0;
    }
    var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (var t = 0; t < 64; t++) {
      var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      var ch = (e & f) ^ (~e & g);
      var temp1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
      var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      var maj = (a & b) ^ (a & c) ^ (b & c);
      var temp2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + temp1) >>> 0;
      d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0;
    H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0;
    H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  return H.map(function (n) { return n.toString(16).padStart(8, '0'); }).join('');
}
function readSource(path) {
  var request = new XMLHttpRequest();
  request.open('GET', path, false);
  request.send(null);
  if (request.status < 200 || request.status >= 300) throw new Error('Unable to read ' + path);
  return request.responseText;
}
var sourceFiles = [location.pathname, 'style.css', 'script.js'];
var sourceText = sourceFiles.map(function (path) {
  return path + '\n' + readSource(path);
}).join('\n\n');
var v = sha256Hex(sourceText).slice(0, 16);
document.write('<link rel="stylesheet" href="style.css?v='+v+'">');
</script>
</head>


<body>

<div class="container">

    <h1>
        GameCube Banner Editor & Converter
    </h1>


    <!-- =========================================================
         File Buttons
         ========================================================= -->

    <div class="button-group">

        <button
            class="btn"
            onclick="
                document
                .getElementById('bnrFileInput')
                .click()
            "
        >
            📁 Open .bnr File
        </button>


        <button
            class="btn btn-secondary"
            onclick="
                document
                .getElementById('imgFileInput')
                .click()
            "
        >
            🖼️ Import Image
        </button>

    </div>


    <input
        type="file"
        id="bnrFileInput"
        accept=".bnr"
        onchange="handleBNRFile(this.files[0])"
    >


    <input
        type="file"
        id="imgFileInput"
        accept="image/*"
        onchange="handleImageFile(this.files[0])"
    >


    <!-- =========================================================
         Preview
         ========================================================= -->

    <div class="panel">

        <div class="panel-title">
            Banner Icon Preview (3x Zoom)
        </div>


        <div class="preview-container">

            <canvas
                id="previewCanvas"
                width="96"
                height="32"
            ></canvas>


            <div
                class="field-row"
                style="width: 100%;"
            >

                <label for="fitMode">
                    Aspect Fit:
                </label>


                <select
                    id="fitMode"
                    disabled
                    onchange="reprocessImage()"
                >

                    <option value="contain">
                        contain
                    </option>

                    <option value="cover">
                        cover
                    </option>

                    <option value="stretch">
                        stretch
                    </option>

                </select>

            </div>

        </div>

    </div>


    <!-- =========================================================
         Metadata
         ========================================================= -->

    <div class="panel">

        <div class="panel-title">
            Banner Details / Metadata
        </div>


        <div class="field-row">

            <label for="titleInput">
                Title:
            </label>


            <input
                type="text"
                id="titleInput"
                placeholder="Game Title"
                maxlength="63"
            >

        </div>


        <div class="field-row">

            <label for="authorInput">
                Author:
            </label>


            <input
                type="text"
                id="authorInput"
                placeholder="Author or Company"
                maxlength="63"
            >

        </div>


        <div class="field-row">

            <label for="descInput">
                Description:
            </label>


            <input
                type="text"
                id="descInput"
                placeholder="App / Game Description"
                maxlength="127"
            >

        </div>

    </div>


    <!-- =========================================================
         Export
         ========================================================= -->

    <div
        class="button-group"
        style="margin-bottom: 0;"
    >

        <button
            class="btn"
            onclick="exportBNR()"
        >
            Save as opening.bnr
        </button>


        <button
            class="btn btn-secondary"
            onclick="exportBMP()"
        >
            Save as GCRebuilder BMP
        </button>

    </div>


    <!-- =========================================================
         GitHub
         ========================================================= -->

    <div style="margin-top: 16px;">

        <a
            href="https://github.com/git2358/GameCube-Banner-Editor-Converter"
            target="_blank"
            rel="noopener noreferrer"
            class="github-btn"
        >
            View on GitHub
        </a>

    </div>


    <!-- =========================================================
         Collapsible Documentation
         ========================================================= -->

    <section
        class="documentation"
        id="documentation"
    >

        <button
            class="documentation-toggle"
            id="documentationToggle"
            type="button"
            aria-expanded="false"
            aria-controls="readme-content"
        >

            <span>
                📖 Documentation
            </span>


            <span
                class="documentation-toggle-icon"
                id="documentationToggleIcon"
            >
                ▼
            </span>

        </button>


        <div
            id="readme-content"
            class="readme-content"
            hidden
        >

            <div class="readme-loading">
                Loading documentation...
            </div>

        </div>

    </section>

</div>



<div class="version"></div>

<script>
document.querySelector('.version').textContent=v;
document.write('<script src="script.js?v='+v+'"><\/script>');
</script>

</body>
</html>
