<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameCube Banner Editor & Converter</title>

    <!-- Markdown renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- HTML sanitizer -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <script>
function makeVersionHash(input) {
  var h = [0x243f6a88, 0x85a308d3, 0x13198a2e, 0x03707344];
  for (var i = 0; i < input.length; i++) {
    var c = input.charCodeAt(i);
    for (var j = 0; j < 4; j++) {
      h[j] = Math.imul(h[j] ^ (c + i + j * 0x9e3779b9), 0x45d9f3b);
      h[j] = (h[j] ^ (h[j] >>> 16)) >>> 0;
    }
  }
  return h.map(function (n) { return n.toString(16).padStart(8, '0'); }).join('');
}
function readSource(path) {
  var request = new XMLHttpRequest();
  request.open('GET', path, false);
  request.send(null);
  if (request.status < 200 || request.status >= 300) throw new Error('Unable to read ' + path);
  return request.responseText;
}
var sourceFiles = [location.pathname, 'style.css', 'script.js'];
var sourceText = sourceFiles.map(function (path) {
  return path + '\n' + readSource(path);
}).join('\n\n');
var v = makeVersionHash(sourceText).slice(0, 32);
document.write('<link rel="stylesheet" href="style.css?v='+v+'">');
</script>
</head>


<body>

<div class="container">

    <h1>
        GameCube Banner Editor & Converter
    </h1>


    <!-- =========================================================
         File Buttons
         ========================================================= -->

    <div class="button-group">

        <button
            class="btn"
            onclick="
                document
                .getElementById('bnrFileInput')
                .click()
            "
        >
            📁 Open .bnr File
        </button>


        <button
            class="btn btn-secondary"
            onclick="
                document
                .getElementById('imgFileInput')
                .click()
            "
        >
            🖼️ Import Image
        </button>

    </div>


    <input
        type="file"
        id="bnrFileInput"
        accept=".bnr"
        onchange="handleBNRFile(this.files[0])"
    >


    <input
        type="file"
        id="imgFileInput"
        accept="image/*"
        onchange="handleImageFile(this.files[0])"
    >


    <!-- =========================================================
         Preview
         ========================================================= -->

    <div class="panel">

        <div class="panel-title">
            Banner Icon Preview (3x Zoom)
        </div>


        <div class="preview-container">

            <canvas
                id="previewCanvas"
                width="96"
                height="32"
            ></canvas>


            <div
                class="field-row"
                style="width: 100%;"
            >

                <label for="fitMode">
                    Aspect Fit:
                </label>


                <select
                    id="fitMode"
                    disabled
                    onchange="reprocessImage()"
                >

                    <option value="contain">
                        contain
                    </option>

                    <option value="cover">
                        cover
                    </option>

                    <option value="stretch">
                        stretch
                    </option>

                </select>

            </div>

        </div>

    </div>


    <!-- =========================================================
         Metadata
         ========================================================= -->

    <div class="panel">

        <div class="panel-title">
            Banner Details / Metadata
        </div>


        <div class="field-row">

            <label for="titleInput">
                Title:
            </label>


            <input
                type="text"
                id="titleInput"
                placeholder="Game Title"
                maxlength="63"
            >

        </div>


        <div class="field-row">

            <label for="authorInput">
                Author:
            </label>


            <input
                type="text"
                id="authorInput"
                placeholder="Author or Company"
                maxlength="63"
            >

        </div>


        <div class="field-row">

            <label for="descInput">
                Description:
            </label>


            <input
                type="text"
                id="descInput"
                placeholder="App / Game Description"
                maxlength="127"
            >

        </div>

    </div>


    <!-- =========================================================
         Export
         ========================================================= -->

    <div
        class="button-group"
        style="margin-bottom: 0;"
    >

        <button
            class="btn"
            onclick="exportBNR()"
        >
            Save as opening.bnr
        </button>


        <button
            class="btn btn-secondary"
            onclick="exportBMP()"
        >
            Save as GCRebuilder BMP
        </button>

    </div>


    <!-- =========================================================
         GitHub
         ========================================================= -->

    <div style="margin-top: 16px;">

        <a
            href="https://github.com/git2358/GameCube-Banner-Editor-Converter"
            target="_blank"
            rel="noopener noreferrer"
            class="github-btn"
        >
            View on GitHub
        </a>

    </div>


    <!-- =========================================================
         Collapsible Documentation
         ========================================================= -->

    <section
        class="documentation"
        id="documentation"
    >

        <button
            class="documentation-toggle"
            id="documentationToggle"
            type="button"
            aria-expanded="false"
            aria-controls="readme-content"
        >

            <span>
                📖 Documentation
            </span>


            <span
                class="documentation-toggle-icon"
                id="documentationToggleIcon"
            >
                ▼
            </span>

        </button>


        <div
            id="readme-content"
            class="readme-content"
            hidden
        >

            <div class="readme-loading">
                Loading documentation...
            </div>

        </div>

    </section>

</div>



<div class="version"></div>

<script>
document.querySelector('.version').textContent=v;
document.write('<script src="script.js?v='+v+'"><\/script>');
</script>

</body>
</html>
